<!DOCTYPE html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROAD KING - 2027</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0A2540"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#E8F1FB;color:#0A2540}header{background:linear-gradient(180deg,#0A2540,#1565C0);color:#fff;padding:14px 14px 10px;text-align:center;position:sticky;top:0;z-index:5}.logo-row{display:flex;align-items:center;justify-content:center;gap:8px}.logo-row img{height:42px;width:auto;border-radius:6px}.logo-row h1{margin:0;font-size:22px;letter-spacing:.5px}.sub{font-size:13px;opacity:.9}.wrap{padding:12px;padding-bottom:90px;max-width:720px;margin:auto}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 4px 14px rgba(10,37,64,.10)} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border-radius:14px;padding:14px;color:#fff;min-height:88px}.b1{background:#1565C0}.b2{background:#1E88E5}.b3{background:#42A5F5;color:#0A2540}.b4{background:#0A2540}.tile small{opacity:.9}.tile b{font-size:24px;display:block;margin-top:4px}button{border:0;border-radius:12px;padding:12px 14px;font-size:16px;cursor:pointer;width:100%} .btn-blue{background:#1565C0;color:#fff}.btn-dark{background:#0A2540;color:#fff}.btn-yellow{background:#FFC400;color:#0A2540;font-weight:800}.btn-light{background:#BBDEFB;color:#0A2540}input,select{width:100%;padding:12px;border:1px solid #BBDEFB;border-radius:10px;margin:6px 0;font-size:16px;background:#fff}label{font-weight:700;font-size:14px}.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none!important}.nav{position:fixed;left:0;right:0;bottom:0;background:#0A2540;display:flex;padding:8px;gap:8px;z-index:10}.nav button{background:#1565C0;color:#fff}.nav button.active{background:#fff;color:#0A2540}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #E3F2FD;text-align:left}.del{background:#0A2540;color:#fff;padding:6px 10px;width:auto;font-size:13px}.small{font-size:13px;color:#455A64}.lock{position:fixed;inset:0;background:#0A2540;color:#fff;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}.lock>div{width:100%;max-width:420px;text-align:center}.lock img{height:54px}
</style></head><body>
<header><div class="logo-row"><img src="logo.jpg" alt="ROAD KING logo"><h1>ROAD KING - 2027</h1></div><div class="sub" id="todayLabel"></div></header>
<div class="wrap">
<div id="page-home">
<div class="grid"><div class="tile b1"><small>අද ආදායම</small><b id="hInc">Rs 0</b></div><div class="tile b2"><small>අද වියදම</small><b id="hExp">Rs 0</b></div><div class="tile b3"><small>අද පෙට්‍රල්</small><b id="hPet">Rs 0</b><span id="hLit"></span></div><div class="tile b4"><small>අද ඉතුරුයි</small><b id="hBal">Rs 0</b></div></div>
<div class="card"><button class="btn-yellow" onclick="show('hire')">⭐ ඊළඟ හයර්</button></div>
<div class="card"><label>ආදායම - Hire එක</label><input id="incNote" placeholder="Hire එක / තැන"><input id="incAmt" type="number" inputmode="numeric" placeholder="මුදල Rs"><button class="btn-blue" onclick="addInc()">ආදායම එකතු කරන්න</button></div>
<div class="card"><label>වියදම - Bill</label><select id="expCat"><option value="">Category තෝරන්න</option><option>ගෙදර වියදම්</option><option>දරුවන්ගේ</option><option>ලිකර්</option><option>අධාර</option><option>බෙට්න්</option><option>බෙහෙත්</option><option>ඔයිල්</option><option>කෑම</option><option>වෙනත්</option></select><input id="expAmt" type="number" inputmode="numeric" placeholder="මුදල Rs"><button class="btn-dark" onclick="addExp()">වියදම එකතු කරන්න</button></div>
<div class="card"><label>පෙට්‍රල්</label><input id="petAmt" type="number" inputmode="numeric" placeholder="මුදල Rs" oninput="calcLit()"><div class="small" id="litPreview"></div><button class="btn-blue" onclick="addPet()">පෙට්‍රල් එකතු කරන්න</button></div>
<div class="card"><b>අද දවසේ ලැයිස්තුව</b><div id="todayList"></div></div>
</div>
<div id="page-report" class="hidden">
<div class="card"><label>මාසය</label><input id="repMonth" type="month" min="2026-01" value="2026-11"><button class="btn-blue" onclick="renderReport()">මාසික වාර්තාව බලන්න</button><button class="btn-dark" style="margin-top:8px" onclick="renderYear()">අවුරුදු වාර්තාව බලන්න</button><label style="margin-top:10px;display:block">අවුරුද්ද</label><select id="repYear"><option>2026</option><option>2027</option><option>2028</option><option>2029</option><option>2030</option></select></div>
<div class="card" id="reportOut"><div class="small">මාසය තෝරා බලන්න.</div></div>
</div>
<div id="page-hire" class="hidden">
<div class="card"><label>නම</label><input id="hireName" placeholder="කාගේ Hire එකද"><label>වෙලාව</label><input id="hireTime" type="time"><label>තැන</label><input id="hirePlace" placeholder="කොහෙද"><button class="btn-yellow" onclick="saveHire()">සේව් කරන්න</button><div style="height:10px"></div><button class="btn-blue" onclick="openClock()">Phone Clock</button><div style="height:8px"></div><button class="btn-dark" onclick="openCal()">Calendar</button></div>
<div class="card"><b>ඊළඟ හයර් ලැයිස්තුව</b><div id="hireList"></div></div>
</div>
<div id="page-settings" class="hidden">
<div class="card"><label>නම</label><input id="sName" placeholder="නම"><label>Three-wheeler අංකය</label><input id="sNum" placeholder="WP-1234"><label>1 ලීටර් පෙට්‍රල් මිල (Rs)</label><input id="sPrice" type="number" placeholder="350"><div class="small" id="trialLabel"></div></div>
<div class="card"><label>Category එකකින් දත්ත සංස්කරණය / ඉවත් කිරීම</label><select id="editCat" onchange="renderEdit()"><option value="">Category තෝරන්න</option><option>ආදායම</option><option>ගෙදර වියදම්</option><option>දරුවන්ගේ</option><option>ලිකර්</option><option>අධාර</option><option>බෙට්න්</option><option>බෙහෙත්</option><option>ඔයිල්</option><option>කෑම</option><option>වෙනත්</option><option>පෙට්‍රල්</option></select><div id="editList"></div><button class="btn-dark" style="margin-top:8px" onclick="clearCat()">තෝරා ඇති Category එක Clear කරන්න</button></div>
<div class="card"><b>Key</b><input id="keyInput" placeholder="RDK-PPPP-MMMM-DU-CCCC"><button class="btn-blue" onclick="activateKey()">Key එක දාන්න</button><div class="small" id="keyMsg"></div><button class="btn-dark" style="margin-top:8px" onclick="openWA()">Key එක ගන්න</button></div>
</div>
</div>
<div id="lock" class="lock hidden"><div><img src="logo.jpg"><h2>ROAD KING - 2027</h2><p>ඇප් එක Lock වෙලා. Key එකක් දාන්න.</p><input id="lockKey" placeholder="RDK-PPPP-MMMM-DU-CCCC"><button class="btn-blue" onclick="activateKey(true)">Key එක දාන්න</button><div style="height:10px"></div><button class="btn-dark" onclick="openWA()">Key එක ගන්න</button><div class="small" id="lockMsg" style="color:#fff"></div></div></div>
<nav class="nav"><button id="n-home" class="active" onclick="show('home')">මුල් පිටුව</button><button id="n-report" onclick="show('report')">වාර්තාව</button><button id="n-hire" onclick="show('hire')">ඊළඟ හයර්</button><button id="n-settings" onclick="show('settings')">සැකසීම්</button></nav>
<script>
let DB=JSON.parse(localStorage.getItem('rk2027')||'{"entries":[],"hires":[],"settings":{"name":"","num":"","price":""},"key":null,"install":""}');
if(!DB.install){DB.install=new Date().toISOString().slice(0,10);save();}
function save(){localStorage.setItem('rk2027',JSON.stringify(DB));}
function fmt(n){return 'Rs '+Number(n||0).toLocaleString('en-LK');}
function today(){return new Date().toISOString().slice(0,10);}
function show(p){['home','report','hire','settings'].forEach(x=>{document.getElementById('page-'+x).classList.toggle('hidden',x!==p);document.getElementById('n-'+x).classList.toggle('active',x===p)});renderAll();window.scrollTo(0,0);}
function calcLit(){let pr=Number(DB.settings.price||0),amt=Number(document.getElementById('petAmt').value||0);document.getElementById('litPreview').textContent=pr>0?('ලීටර් '+(amt/pr).toFixed(2)):"";}
function addInc(){let amt=Number(document.getElementById('incAmt').value);if(!amt)return alert('මුදල ගහන්න');DB.entries.push({d:today(),type:'inc',cat:'ආදායම',note:document.getElementById('incNote').value,amt});save();document.getElementById('incAmt').value='';document.getElementById('incNote').value='';renderAll();}
function addExp(){let amt=Number(document.getElementById('expAmt').value),cat=document.getElementById('expCat').value;if(!cat)return alert('Category තෝරන්න');if(!amt)return alert('මුදල ගහන්න');DB.entries.push({d:today(),type:'exp',cat,amt});save();document.getElementById('expAmt').value='';renderAll();}
function addPet(){let amt=Number(document.getElementById('petAmt').value);if(!amt)return alert('මුදල ගහන්න');let pr=Number(DB.settings.price||0);DB.entries.push({d:today(),type:'pet',cat:'පෙට්‍රල්',amt,lit:pr>0?amt/pr:0});save();document.getElementById('petAmt').value='';renderAll();}
function delEntry(i){if(confirm('මේක ඉවත් කරන්නද?')){DB.entries.splice(i,1);save();renderAll();}}
function renderAll(){let t=today();let inc=0,exp=0,pet=0,lit=0;let list='';DB.entries.forEach((e,i)=>{if(e.d===t){if(e.type==='inc')inc+=e.amt;if(e.type==='exp')exp+=e.amt;if(e.type==='pet'){pet+=e.amt;lit+=e.lit||0;}list+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${e.cat} ${e.note||''} ${e.lit?(' - '+e.lit.toFixed(2)+' L'):''}</span><span>${fmt(e.amt)} <button class="del" onclick="delEntry(${i})">ඉවත්</button></span></div>`}});document.getElementById('hInc').textContent=fmt(inc);document.getElementById('hExp').textContent=fmt(exp);document.getElementById('hPet').textContent=fmt(pet);document.getElementById('hLit').textContent=lit?(' • '+lit.toFixed(2)+' L'):'';document.getElementById('hBal').textContent=fmt(inc-exp-pet);document.getElementById('todayList').innerHTML=list||'<div class="small">අද දත්ත නැහැ.</div>';document.getElementById('todayLabel').textContent=t;let hl='';DB.hires.forEach((h,i)=>{hl+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${h.name} - ${h.time} - ${h.place}</span><button class="del" onclick="delHire(${i})">ඉවත්</button></div>`});document.getElementById('hireList').innerHTML=hl||'<div class="small">ඊළඟ හයර් නැහැ.</div>';checkLock();}
function saveHire(){let n=document.getElementById('hireName').value,t=document.getElementById('hireTime').value,p=document.getElementById('hirePlace').value;if(!n||!t)return alert('නමයි වෙලාවයි ගහන්න');DB.hires.push({name:n,time:t,place:p});save();renderAll();}
function delHire(i){DB.hires.splice(i,1);save();renderAll();}
function openClock(){try{window.open('https://calendar.google.com/calendar/','_blank')}catch(e){} alert('Phone Clock එකේ Alarm එක දාගන්න');}
function openCal(){let h=DB.hires[DB.hires.length-1];let txt=h?`${h.name} ${h.time} ${h.place}`:'ROAD KING Hire';window.open('https://calendar.google.com/calendar/r/eventedit?text='+encodeURIComponent(txt),'_blank');}
function renderReport(){let m=document.getElementById('repMonth').value;if(!m)return;let rows='';let ti=0,te=0,tp=0,tl=0;let days={};DB.entries.forEach(e=>{if(e.d.startsWith(m)){if(!days[e.d])days[e.d]={i:0,e:0,p:0,l:0};if(e.type==='inc')days[e.d].i+=e.amt;if(e.type==='exp')days[e.d].e+=e.amt;if(e.type==='pet'){days[e.d].p+=e.amt;days[e.d].l+=e.lit||0;}}});Object.keys(days).sort().forEach(d=>{let r=days[d];ti+=r.i;te+=r.e;tp+=r.p;tl+=r.l;rows+=`<tr><td>${d}</td><td>${fmt(r.i)}</td><td>${fmt(r.e)}</td><td>${fmt(r.p)} (${r.l.toFixed(2)} L)</td><td>${fmt(r.i-r.e-r.p)}</td></tr>`});document.getElementById('reportOut').innerHTML=`<b>${m} - මාසික වාර්තාව</b><table><tr><th>දිනය</th><th>ආදායම</th><th>වියදම</th><th>පෙට්‍රල්</th><th>ඉතුරුයි</th></tr>${rows||'<tr><td colspan=5>දත්ත නැහැ.</td></tr>'}</table><p><b>මුළු ආදායම:</b> ${fmt(ti)}<br><b>මුළු වියදම:</b> ${fmt(te)}<br><b>මුළු පෙට්‍රල්:</b> ${fmt(tp)} (${tl.toFixed(2)} L)<br><b>මුළු ඉතුරුයි:</b> ${fmt(ti-te-tp)}</p>`;}
function renderYear(){let y=document.getElementById('repYear').value;let months={};for(let i=1;i<=12;i++){let mm=String(i).padStart(2,'0');months[y+'-'+mm]={i:0,e:0,p:0,l:0}}DB.entries.forEach(e=>{if(e.d.startsWith(y)){let k=e.d.slice(0,7);if(e.type==='inc')months[k].i+=e.amt;if(e.type==='exp')months[k].e+=e.amt;if(e.type==='pet'){months[k].p+=e.amt;months[k].l+=e.lit||0}}});let rows='',ti=0,te=0,tp=0,tl=0;Object.keys(months).forEach(k=>{let r=months[k];ti+=r.i;te+=r.e;tp+=r.p;tl+=r.l;rows+=`<tr><td>${k}</td><td>${fmt(r.i)}</td><td>${fmt(r.e)}</td><td>${fmt(r.p)} (${r.l.toFixed(2)} L)</td><td>${fmt(r.i-r.e-r.p)}</td></tr>`});document.getElementById('reportOut').innerHTML=`<b>${y} - අවුරුදු වාර්තාව</b><table><tr><th>මාසය</th><th>ආදායම</th><th>වියදම</th><th>පෙට්‍රල්</th><th>ඉතුරුයි</th></tr>${rows}</table><p><b>අවුරුද්දේ මුළු ඉතුරුයි:</b> ${fmt(ti-te-tp)}</p>`;}
function renderEdit(){let c=document.getElementById('editCat').value;let html='';DB.entries.forEach((e,i)=>{if(e.cat===c){html+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${e.d} - ${fmt(e.amt)}</span><span><button class="del" onclick="editEntry(${i})">Edit</button> <button class="del" onclick="delEntry(${i})">Delete</button></span></div>`}});document.getElementById('editList').innerHTML=html||'<div class="small">දත්ත නැහැ.</div>';}
function editEntry(i){let v=prompt('අලුත් මුදල',DB.entries[i].amt);if(v!==null&&Number(v)>=0){DB.entries[i].amt=Number(v);save();renderAll();renderEdit();}}
function clearCat(){let c=document.getElementById('editCat').value;if(!c)return;if(confirm(c+' Category එක Clear කරන්නද?')){DB.entries=DB.entries.filter(e=>e.cat!==c);save();renderAll();renderEdit();}}
function openWA(){window.open('https://wa.me/94713079394?text='+encodeURIComponent('ROAD KING Key එකක් ගන්න ඕන'),'_blank');}
// settings autosave
['sName','sNum','sPrice'].forEach(id=>{document.getElementById(id).addEventListener('input',()=>{DB.settings.name=document.getElementById('sName').value;DB.settings.num=document.getElementById('sNum').value;DB.settings.price=document.getElementById('sPrice').value;save();calcLit();});});
function trialDays(){let inst=new Date(DB.install);let now=new Date();let diff=Math.floor((now-inst)/86400000);return Math.max(0,7-diff);}
function validKey(k){try{let p=k.split('-');if(p.length!==5||p[0]!=='RDK')return null;let pppp=Number(p[1]),mmmm=Number(p[2]),du=p[3],cccc=Number(p[4]);let d=Number(du.slice(0,-1)),u=du.slice(-1);let calc=(pppp*7+mmmm*13+d*29+4317)%10000;if(calc!==cccc)return null;return {months:u==='M'?1:12};}catch(e){return null}}
function activateKey(fromLock){let inp=document.getElementById(fromLock?'lockKey':'keyInput').value.trim().toUpperCase();let v=validKey(inp,0);if(!v){document.getElementById(fromLock?'lockMsg':'keyMsg').textContent='Key එක වැරදියි.';return;}DB.key={key:inp,from:today(),months:v.months};save();checkLock();document.getElementById(fromLock?'lockMsg':'keyMsg').textContent='Key එක Active.';renderAll();}
function checkLock(){let locked=false;if(DB.key){let f=new Date(DB.key.from);let exp=new Date(f);exp.setMonth(exp.getMonth()+DB.key.months);if(new Date()>exp)locked=true;}else if(trialDays()<=0)locked=true;document.getElementById('lock').classList.toggle('hidden',!locked);document.getElementById('trialLabel').textContent='Trial • ඉතිරි දවස් '+trialDays();document.getElementById('sName').value=DB.settings.name||'';document.getElementById('sNum').value=DB.settings.num||'';document.getElementById('sPrice').value=DB.settings.price||'';}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
renderAll();
</script></body></html>
